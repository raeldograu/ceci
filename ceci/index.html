
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vote na Melhor Foto</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #000000, #1a001f, #32004b);
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
      text-align: center;
      animation: fundoAnimado 8s infinite alternate;
    }

    @keyframes fundoAnimado {
      0% { background-position: left; }
      100% { background-position: right; }
    }

    h1 {
      margin-top: 30px;
      font-size: 2.5rem;
      color: #ff4df0;
      text-shadow: 0 0 10px #ff00ff, 0 0 20px #8a2be2;
      animation: piscar 1.5s infinite alternate;
    }

    @keyframes piscar {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }

    .container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 40px;
      margin-top: 50px;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid #ff00ff;
      border-radius: 25px;
      padding: 20px;
      width: 320px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 20px rgba(255, 0, 255, 0.4);
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: scale(1.08) rotate(2deg);
      box-shadow: 0 0 30px #ff00ff;
    }

    .card::before {
      content: "";
      position: absolute;
      top: -100%;
      left: -100%;
      width: 300%;
      height: 300%;
      background: linear-gradient(45deg, transparent, rgba(255,255,255,0.2), transparent);
      transform: rotate(25deg);
      animation: brilho 5s infinite;
    }

    @keyframes brilho {
      0% { top: -100%; left: -100%; }
      100% { top: 100%; left: 100%; }
    }

    img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 20px;
      border: 3px solid #8a2be2;
      transition: transform 0.4s ease;
    }

    img:hover {
      transform: scale(1.05);
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      border: none;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      color: white;
      background: linear-gradient(45deg, #ff00cc, #3333ff);
      box-shadow: 0 0 15px #ff00ff;
      transition: all 0.3s ease;
    }

    button:hover {
      transform: scale(1.1);
      box-shadow: 0 0 25px #ff00ff;
    }

    .resultado {
      margin-top: 15px;
      font-size: 1.1rem;
      color: #ffffff;
      text-shadow: 0 0 5px #ff00ff;
    }

    mark {
      background-color: #ff00ff;
      color: white;
      padding: 4px 10px;
      border-radius: 10px;
    }

    footer {
      margin-top: 40px;
      padding: 20px;
      font-size: 0.9rem;
      color: #cccccc;
    }
  </style>
</head>
<body>

  <h1>✨ Clique se você gostou 😘 ✨</h1>

  <div class="container">

    <div class="card">
      <img src="ceci1.jpeg" alt="Primeira Foto">
      <button onclick="votarFoto1()">❤️ Primeira Foto ❤️</button>
      <div class="resultado" id="resultado1">
        Primeira Foto
      </div>
    </div>

    <div class="card">
      <img src="ceci2.jpeg" alt="Segunda Foto">
      <button onclick="votarFoto2()">❤️ Segunda Foto ❤️</button>
      <div class="resultado" id="resultado2">
        Segunda Foto
      </div>
    </div>

  </div>

  <footer>
    Feito com efeitos exagerados porque claramente o bom senso foi abandonado.
  </footer>

  <script>
    let contador1 = 0;
    let contador2 = 0;

    function votarFoto1() {
      contador1++;
      document.getElementById("resultado1").innerHTML =
        `Primeira Foto recebeu <mark>${contador1}</mark> curtidas! 🎉`;
    }

    function votarFoto2() {
      contador2++;
      document.getElementById("resultado2").innerHTML =
        `Segunda Foto recebeu <mark>${contador2}</mark> curtidas! 💖`;
    }
  </script>

</body>
</html>
